name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install AI server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -r ai-server/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile ai-server/ai_server.py

      - name: Validate Docker Compose
        run: |
          docker compose config

      - name: Build Web Server image
        run: |
          docker build -t qwen-web-server:ci ./web-server

      - name: Build AI Server image
        run: |
          docker build -t qwen-ai-server:ci ./ai-server
