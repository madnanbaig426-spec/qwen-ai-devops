name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install AI server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.0+cpu \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -r ai-server/requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile ai-server/ai_server.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            web-server/package-lock.json

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Install Web Server dependencies
        working-directory: web-server
        run: npm ci

      - name: Validate Web Server
        working-directory: web-server
        run: node --check server.js

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Frontend Docker image
        run: docker build -t qwen-frontend:ci ./frontend

      - name: Build Web Server Docker image
        run: docker build -t qwen-web-server:ci ./web-server

      - name: Build AI Server Docker image
        run: docker build -t qwen-ai-server:ci ./ai-server
